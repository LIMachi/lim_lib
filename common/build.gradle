architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}

processResources {
    filesMatching(['*.mixins.json', 'assets/*', 'data/*', 'pack.mcmeta']) {
        expand  version: project.version,
                mod_id: project.mod_id,
                readable_name: project.readable_name,
                description: project.description,
                author: project.author,
                license: project.license,
                minecraft_version: project.minecraft_version,
                mod_root: project.mod_root
    }
}

def generatedPropertiesDir = "$buildDir/generated/sources/properties"

task generateBuildConstants {
    doLast {
        def props = new Properties();
        new File("$rootDir/gradle.properties").withInputStream {
            s -> props.load(s)
        }

        def dir = new File(generatedPropertiesDir, project.mod_root.replace('.', '/'))
        dir.mkdirs()

        def sb = new StringBuilder();
        sb.append("package ").append(project.mod_root).append(";\n\npublic class Properties {");

        props.each { k, v ->
            if (project.hasProperty(k) && !k.contains('.') && !(v instanceof Closure))
                sb.append("\n                public static final String ").append(k).append(" = \"").append(v).append("\";");
        }

        sb.append("\n}");

        new File(dir, 'Properties.java').text = sb.toString().stripIndent()
    }
}

compileJava.dependsOn(generateBuildConstants)
sourceSets.main.java.srcDirs += generatedPropertiesDir